<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外遇模擬器</title>
<style>
  :root {
    --bg: #17111f; --panel: #241a31; --panel2: #2f2240; --text: #f3ecf8; --dim: #b3a4c4;
    --pink: #ff5c8a; --gold: #ffc857; --red: #ff3b3b; --green: #58d68d; --line: #44345a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(circle at 50% 0%, #3a1f4a 0%, var(--bg) 60%) fixed;
    color: var(--text); font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    line-height: 1.7; min-height: 100vh;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 34px; margin: 8px 0 0; text-align: center; letter-spacing: 4px; color: var(--pink); text-shadow: 0 0 18px #ff5c8a66; }
  h2 { font-size: 22px; margin: 0 0 10px; color: var(--gold); }
  .sub { text-align: center; color: var(--dim); margin: 4px 0 20px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .story { font-size: 17px; white-space: pre-line; }
  button {
    font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: .15s;
  }
  button:hover { border-color: var(--pink); background: #3b2a50; }
  .choice { display: block; width: 100%; text-align: left; margin-top: 10px; font-size: 16px; }
  .primary { background: var(--pink); border-color: var(--pink); color: #2a0c18; font-weight: bold; }
  .primary:hover { background: #ff7da2; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  /* 捏臉 */
  .creator { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 600px) { .creator { grid-template-columns: 1fr; } }
  .avatar { border-radius: 50%; overflow: hidden; display: block; background: #4a3a63; }
  .avatar.big { width: 200px; height: 200px; margin: 0 auto 12px; border: 3px solid var(--pink); }
  .avatar.mid { width: 84px; height: 84px; border: 2px solid var(--line); flex: none; }
  .attr { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .attr .n { width: 76px; color: var(--dim); font-size: 14px; flex: none; }
  .attr .v { flex: 1; text-align: center; font-size: 15px; }
  .attr button { padding: 2px 12px; }
  input[type=text] {
    font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #1a1324; color: var(--text); text-align: center;
  }
  /* 角色卡 */
  .card { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .card:last-child { border-bottom: 0; }
  .card .role { font-size: 12px; color: var(--pink); letter-spacing: 2px; }
  .card .name { font-size: 19px; font-weight: bold; }
  .card .info { font-size: 14px; color: var(--dim); }
  /* HUD */
  .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bar-label { font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
  .bar { height: 12px; background: #150f1d; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; transition: width .5s; }
  .bar.sus i { background: linear-gradient(90deg, var(--gold), var(--red)); }
  .bar.aff i { background: linear-gradient(90deg, #b565ff, var(--pink)); }
  .chapter { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 8px; letter-spacing: 2px; }
  .delta { margin-top: 12px; font-size: 15px; }
  .up { color: var(--red); } .down { color: var(--green); } .love { color: var(--pink); }
  .end-title { font-size: 30px; text-align: center; margin: 6px 0 12px; }
  .bad { color: var(--red); } .good { color: var(--gold); }
  .shake { animation: shake .5s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  /* 過場動畫舞台 */
  .stage { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; margin-bottom: 14px; container-type: inline-size; border: 1px solid var(--line); background: #111; }
  .stage.small { aspect-ratio: 16/6; }
  .stage .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: #0000004d; }
  .stage .lb { position: absolute; left: 0; right: 0; height: 6%; background: #000; z-index: 4; }
  .stage .lb.t { top: 0; } .stage .lb.b { bottom: 0; }
  .bg-bed { background: linear-gradient(#141a3a, #2a2350); }
  .bg-office { background: linear-gradient(#27405e, #16202e); }
  .bg-date { background: linear-gradient(#ff9a8b, #a04a7a 60%, #3a2050); }
  .bg-home { background: linear-gradient(#6b4a34, #33221a); }
  .bg-rain { background: linear-gradient(#1c2430, #0c1016); }
  .bg-split { background: linear-gradient(90deg, #5a1f2e 50%, #2e2a5e 50%); }
  .bg-morning { background: linear-gradient(#f3d9a4, #b98a5a); }
  .bg-tea { background: linear-gradient(#4a0f12, #1c0808); }
  .bg-river { background: linear-gradient(#f08a5d, #6a2c70 70%, #1b1b3a); }
  .bg-hall { background: radial-gradient(circle at 50% 30%, #fff8c4 0, #52467a 35%, #120e1c 75%); }
  .bg-red { background: radial-gradient(#b3122a, #1a0306); }
  .bg-warm { background: linear-gradient(#f6c98a, #8a4a2a); }
  .stage .el { position: absolute; transform: translate(-50%, -50%); text-align: center; line-height: 1; z-index: 2; }
  .stage .mv, .stage .lp { position: relative; }
  .stage .actor { display: block; width: 100%; height: auto; border-radius: 50%; border: .5cqw solid #ffffffaa; box-shadow: 0 1cqw 3cqw #0008; }
  .stage .tag { display: inline-block; margin-top: 1cqw; padding: .4cqw 1.6cqw; border-radius: 99px; background: #000a; color: #fff; font-size: 2.6cqw; white-space: nowrap; }
  .stage .emo { position: absolute; top: -10%; right: -14%; font-size: 7cqw; animation: pop .4s both; }
  .stage .bubble { background: #fff; color: #222; padding: 1cqw 2.2cqw; border-radius: 3cqw; font-size: 3.4cqw; white-space: nowrap; box-shadow: 0 .6cqw 2cqw #0006; }
  .stage .wall { color: var(--gold); font-size: 6cqw; letter-spacing: 1.5cqw; white-space: nowrap; font-weight: bold; text-shadow: 0 0 2cqw #000; }
  .stage .tcard { position: absolute; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; animation: tout .6s 1.2s forwards; }
  .stage .tcard small { font-size: 3cqw; color: var(--dim); letter-spacing: 1cqw; }
  .stage .tcard b { font-size: 6cqw; color: var(--pink); letter-spacing: .6cqw; margin-top: 1.5cqw; }
  .stage .rain { position: absolute; inset: 0; z-index: 3; pointer-events: none; background-image: repeating-linear-gradient(105deg, transparent 0 20px, rgba(200,225,255,.4) 20px 21px); animation: rain .35s linear infinite; }
  .stage .fl { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 3; pointer-events: none; animation: flash 4s 1.4s infinite; }
  .enterL { animation: enterL .8s both; } .enterR { animation: enterR .8s both; }
  .fadein { animation: fadein .8s both; } .pop { animation: pop .45s both; }
  .zoom { animation: zoom .7s both; } .carIn { animation: carIn 1s both; }
  .bob { animation: bob 2.2s ease-in-out infinite; }
  .pulse { animation: pulse 1s ease-in-out infinite; } .floatUp { animation: floatUp 2.6s ease-in infinite; }
  .drift { animation: drift 5s linear infinite; } .wobble { animation: wobble 2.4s ease-in-out infinite; }
  .nearL { animation: nearL 1s both; } .nearR { animation: nearR 1s both; }
  .stage .shake { animation: shake2 .35s infinite; }
  @keyframes tout { to { opacity: 0; visibility: hidden; } }
  @keyframes enterL { from { transform: translateX(-60cqw); opacity: 0; } }
  @keyframes enterR { from { transform: translateX(60cqw); opacity: 0; } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes zoom { from { transform: scale(.2); opacity: 0; } }
  @keyframes carIn { from { transform: translateX(70cqw); } }
  @keyframes bob { 50% { transform: translateY(-1.5cqw); } }
  @keyframes shake2 { 25% { transform: translateX(-.8cqw); } 75% { transform: translateX(.8cqw); } }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34cqw); opacity: 0; } }
  @keyframes drift { from { transform: translate(0, 0) rotate(0); } to { transform: translate(115cqw, 12cqw) rotate(540deg); } }
  @keyframes wobble { 0%,100% { transform: translateX(-15cqw); } 50% { transform: translateX(15cqw); } }
  @keyframes nearL { to { transform: translateX(-13cqw); } }
  @keyframes nearR { to { transform: translateX(13cqw); } }
  @keyframes rain { to { background-position: -22px 80px; } }
  @keyframes flash { 0%, 7%, 100% { opacity: 0; } 2% { opacity: .8; } 4% { opacity: .15; } 5% { opacity: .6; } }
  .note { font-size: 12px; color: var(--dim); text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<button id="mute" title="音效開關" style="position:fixed;top:12px;right:12px;z-index:9;font-size:18px;padding:6px 10px">🔊</button>
<div id="app"></div>
<script src="game.js"></script>
</body>
</html>
